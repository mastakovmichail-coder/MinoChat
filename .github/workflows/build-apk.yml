name: Build MinoChat APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/android-setup.py
      - run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK (v1+v2+v3) and verify
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "built: $SRC"
          $BT/zipalign -f -p 4 "$SRC" aligned.apk
          $BT/apksigner sign --ks minochat.keystore --ks-pass pass:minochat123 --ks-key-alias minochat --key-pass pass:minochat123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out MinoChat.apk aligned.apk
          $BT/apksigner verify --verbose --print-certs MinoChat.apk
          if $BT/aapt dump xmltree MinoChat.apk AndroidManifest.xml | grep -i "debuggable.*0xffffffff"; then echo "ERROR: APK is still DEBUGGABLE"; exit 1; fi
          echo "OK: release build, not debuggable"
      - uses: actions/upload-artifact@v4
        with:
          name: MinoChat-APK-RELEASE-3.7.4
          path: |
            MinoChat.apk
            apk.json
