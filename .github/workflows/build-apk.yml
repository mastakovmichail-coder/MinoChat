name: Build MinoChat APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minochat-apk-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/android-setup.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: minochat-apk-project/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MinoChat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MinoChat-APK
          path: minochat-apk-project/MinoChat.apk
