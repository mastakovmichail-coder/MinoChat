<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050814">
<meta name="ui-version" content="3.6.0">
<link rel="icon" id="fav" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MinoChat">
<title>MinoChat</title>
<style>
:root{
  --bg:#050814;--panel:#0a0f21;--panel2:#101830;--line:rgba(120,160,255,.13);--text:#e8eeff;--muted:#8794b8;
  --a1:#2f6bff;--a2:#27c4ff;--grad:linear-gradient(135deg,#2f6bff,#27c4ff);--me:linear-gradient(135deg,#2457e6,#1795d6);
  --them:#131c38;--danger:#ff5c7a;--ok:#34d399;--shadow:0 20px 60px rgba(0,0,0,.55);--fs:15px;
}
[data-theme=light]{
  --bg:#eef3ff;--panel:#fff;--panel2:#f1f5ff;--line:rgba(20,40,100,.1);--text:#101a33;--muted:#667298;
  --them:#e6edff;--shadow:0 20px 50px rgba(40,70,160,.18);
}
[data-amoled=on]{--bg:#000;--panel:#050505;--panel2:#0e0e0e;--them:#151515}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(800px 560px at 8% -8%,rgba(47,107,255,.30),transparent 60%),
  radial-gradient(720px 520px at 108% 108%,rgba(39,196,255,.20),transparent 60%)}
#root{position:relative;z-index:1;height:100%}

/* ---------- вход ---------- */
.center{height:100%;display:grid;place-items:center;padding:16px;overflow:auto}
.card{width:min(100%,430px);padding:30px 26px;border-radius:28px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}}
.logo{width:84px;height:84px;border-radius:24px;margin:0 auto 10px;display:grid;place-items:center;background:#000;box-shadow:0 14px 40px rgba(47,107,255,.55);animation:float 4s ease-in-out infinite;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo svg{width:34px;height:34px;fill:#fff}
@keyframes float{50%{transform:translateY(-6px)}}
h1.brand{margin:0;text-align:center;font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:4px 0 18px;text-align:center;color:var(--muted);font-size:14px;min-height:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--panel2);margin-bottom:16px}
.tabs button{padding:11px;border-radius:12px;font-weight:600;color:var(--muted);transition:.25s}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(47,107,255,.38)}
label.f{display:block;margin:12px 0 6px 3px;font-size:12.5px;color:var(--muted)}
.inp{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);outline:none;transition:.2s}
.inp:focus{border-color:var(--a1);box-shadow:0 0 0 4px rgba(47,107,255,.2)}
.btn{width:100%;margin-top:16px;padding:14px;border-radius:15px;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 12px 28px rgba(47,107,255,.4);transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:13px;border-radius:15px;background:#fff;color:#222;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:.2s}
.gbtn:hover{transform:translateY(-2px)}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--muted);font-size:12.5px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.link{display:block;margin:14px auto 0;color:var(--a2);font-size:13.5px}
.err{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.4);color:#ff8aa0;font-size:13.5px;display:none}
.err.on{display:block;animation:pop .3s both}
.okmsg{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:var(--ok);font-size:13.5px}
.hint{font-size:12px;color:var(--muted);margin:6px 3px 0}
code.k{background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:12.5px}

/* ---------- приложение ---------- */
.app{display:grid;grid-template-columns:360px 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--panel) 92%,transparent);border-right:1px solid var(--line);backdrop-filter:blur(14px)}
.me{display:flex;align-items:center;gap:12px;padding:14px 16px}
.me .nm{flex:1;min-width:0}.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--muted)}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;transition:.2s;flex:none}
.ib:hover{background:var(--panel2)}.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search{margin:0 14px 8px;position:relative}.search .inp{padding-left:40px;border-radius:15px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.list{flex:1;overflow:auto;padding:4px 8px 12px}
.sect{margin:10px 10px 4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:16px;text-align:left;transition:background .2s;animation:rowin .35s both}
@keyframes rowin{from{opacity:0;transform:translateX(-10px)}}
.row:hover{background:var(--panel2)}.row.on{background:linear-gradient(135deg,rgba(47,107,255,.24),rgba(39,196,255,.14))}
.row .mid{flex:1;min-width:0}.row .t1{display:flex;justify-content:space-between;gap:8px}.row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{color:var(--muted);font-size:12px;flex:none}.row .t2{display:flex;justify-content:space-between;gap:8px;margin-top:2px}
.row .pv{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;animation:pop .3s both}
.av{position:relative;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.av.sm{width:34px;height:34px;font-size:14px}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:3px solid var(--panel)}
.empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55}

.pane{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.none{margin:auto;text-align:center;color:var(--muted);padding:20px;animation:pop .6s both}
.none .logo{margin-bottom:14px}
.head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px)}
.head .nm{flex:1;min-width:0}.head b{display:block}.head small{color:var(--muted)}.head small.live{color:var(--ok)}
.back{display:none}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.day{align-self:center;margin:12px 0 6px;padding:4px 12px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:12px}
.m{max-width:min(78%,560px);display:flex;flex-direction:column;position:relative;animation:min .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.97)}}
.m.me{align-self:flex-end;align-items:flex-end}.m.them{align-self:flex-start}
.bub{padding:9px 13px 7px;border-radius:19px;line-height:1.42;word-break:break-word;white-space:pre-wrap;position:relative}
.me .bub{background:var(--me);color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(47,107,255,.25)}
.them .bub{background:var(--them);border-bottom-left-radius:6px}
.bub .meta{display:flex;justify-content:flex-end;gap:6px;margin-top:3px;font-size:11px;opacity:.7}
.bub.sticker{background:none!important;box-shadow:none!important;font-size:76px;line-height:1.05;padding:0 4px}
.bub.sticker .meta{font-size:11px;color:var(--muted)}
.bub.del{opacity:.55;font-style:italic;background:var(--panel2)!important;color:var(--muted)!important;box-shadow:none!important}
.rp{margin-bottom:6px;padding:5px 9px;border-left:3px solid var(--a2);border-radius:8px;background:rgba(0,0,0,.18);font-size:13px;opacity:.9;cursor:pointer}
.rp b{display:block;font-size:12px}.rp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rx button{padding:2px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;transition:.15s}
.rx button.mine{border-color:var(--a2);background:rgba(236,72,153,.16)}.rx button:hover{transform:scale(1.1)}
.more{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--panel2);opacity:0;transition:.15s;font-size:16px;line-height:1;border:1px solid var(--line)}
.me .more{left:-34px}.them .more{right:-34px}.m:hover .more{opacity:1}
@media(hover:none){.more{opacity:.55}}
.typing span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:var(--muted);animation:bnc 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bnc{50%{transform:translateY(-4px);opacity:.4}}

.bar{padding:8px 12px 12px;position:relative}
.ctx{display:flex;align-items:center;gap:10px;margin:0 4px 8px;padding:8px 12px;border-radius:14px;background:var(--panel2);border-left:3px solid var(--a2);animation:pop .25s both}
.ctx .tx{flex:1;min-width:0;font-size:13px}.ctx b{display:block;color:var(--a2);font-size:12px}.ctx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.comp{display:flex;align-items:flex-end;gap:8px;padding:6px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.comp textarea{flex:1;resize:none;max-height:140px;min-height:40px;padding:10px 6px;background:none;border:0;outline:none;line-height:1.35}
.send{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;transition:.2s;box-shadow:0 8px 20px rgba(47,107,255,.4)}
.send:hover{transform:scale(1.08) rotate(-8deg)}.send svg{width:20px;height:20px;fill:#fff}
.emo{position:absolute;left:12px;bottom:74px;width:min(340px,calc(100% - 24px));max-height:300px;overflow:auto;padding:10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:30;animation:pop .25s both}
.emo .tb{display:flex;gap:6px;margin-bottom:8px}.emo .tb button{flex:1;padding:7px;border-radius:10px;background:var(--panel2);font-size:13px}.emo .tb button.on{background:var(--grad);color:#fff}
.emo .g{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.emo .g button{font-size:22px;padding:5px;border-radius:10px;transition:.12s}.emo .g button:hover{background:var(--panel2);transform:scale(1.2)}
.emo .g.st{grid-template-columns:repeat(4,1fr)}.emo .g.st button{font-size:44px}
.menu{position:fixed;z-index:60;min-width:200px;padding:6px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .18s both}
.menu .rr{display:flex;justify-content:space-between;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .rr button{font-size:21px;padding:3px 5px;border-radius:10px;transition:.12s}.menu .rr button:hover{transform:scale(1.25);background:var(--panel2)}
.menu .it{display:block;width:100%;padding:10px 12px;border-radius:11px;text-align:left}.menu .it:hover{background:var(--panel2)}.menu .it.red{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal .card{width:min(100%,420px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;padding:11px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .3s both}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.sw input{width:42px;height:24px;accent-color:#2f6bff}

.nb{display:flex;align-items:center;gap:8px;margin:0 14px 8px;padding:9px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(47,107,255,.2),rgba(39,196,255,.14));border:1px solid var(--line);font-size:13px;animation:pop .3s both}
.nb span{flex:1}.nb .nyes{padding:6px 12px;border-radius:10px;background:var(--grad);color:#fff;font-weight:600}.nb .nx{opacity:.6;padding:4px 6px}
.ph{display:block;max-width:min(300px,100%);max-height:320px;border-radius:14px;margin:0 0 4px;cursor:zoom-in;object-fit:cover}
.bub audio{display:block;max-width:240px;height:38px;margin-bottom:2px}
.comp.recing>*:not(.recbar){display:none}.recbar{display:none;align-items:center;gap:10px;flex:1;padding:4px 8px}.comp.recing .recbar{display:flex}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:bnc 1s infinite;flex:none}.recbar .grow{flex:1;color:var(--muted)}
.lb{max-width:96vw;max-height:92vh;border-radius:14px;box-shadow:var(--shadow)}
.older{align-self:center;margin:6px 0;padding:6px 14px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:12.5px}

/* ---------- новое: группы, звонки, стикеры, опросы ---------- */
.pinbar{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:13px;cursor:pointer}
.pinbar .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinbar button{opacity:.6;padding:2px 6px}
.msb{padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}.msb .inp{padding:9px 13px;border-radius:12px}
.sname{font-size:12px;font-weight:700;margin:0 0 2px 4px}.fwd{font-size:12px;opacity:.8;margin-bottom:4px;font-style:italic}
.stimg{width:150px;height:150px;object-fit:contain;display:block}.lnk{color:inherit;text-decoration:underline;word-break:break-all}
mark{background:rgba(255,200,40,.45);color:inherit;border-radius:4px;padding:0 1px}
.poll{min-width:220px}.poll .q{font-weight:700;margin-bottom:6px}
.po{position:relative;display:block;width:100%;margin:4px 0;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.2);text-align:left;overflow:hidden;white-space:normal}
.po i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.2);z-index:0;transition:width .3s}.po span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}.po.mine{outline:2px solid rgba(255,255,255,.6)}
.emo .tb{overflow-x:auto}.emo .tb button{flex:none;min-width:44px;white-space:nowrap}.emo .tb button img{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.emo .g.pk{grid-template-columns:repeat(4,1fr)}.emo .g.pk button img{width:64px;height:64px;object-fit:contain}
.callbox{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 600px at 50% 0,#2a1d6b,#0b0b14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;animation:fade .25s both}
.callbox video.rem{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.callbox video.rem.aud{opacity:0;pointer-events:none}
.callbox video.loc{position:absolute;right:16px;top:16px;width:110px;height:150px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.45);background:#222;z-index:2;transform:scaleX(-1)}
.callbox .info{position:relative;z-index:2;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.6)}.callbox .info .av{width:104px;height:104px;font-size:42px;margin:0 auto 12px;animation:float 3s ease-in-out infinite}
.callbox .info b{font-size:24px;display:block}.callbox .info small{opacity:.85}
.callbox .ctl{position:absolute;bottom:42px;z-index:2;display:flex;gap:18px}
.cb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;transition:.2s}.cb:hover{transform:scale(1.08)}
.cb svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb.red{background:#e5304f}.cb.red svg{transform:rotate(135deg)}.cb.grn{background:#22c55e}.cb.off{background:#fff;color:#111}
.ring{animation:ringp 1s infinite}@keyframes ringp{50%{transform:scale(1.12)}}
.accr{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:14px;text-align:left}.accr:hover{background:var(--panel2)}.accr.cur{background:rgba(47,107,255,.2)}
.accr .nm{flex:1;min-width:0}.accr small{color:var(--muted)}
.cols{display:flex;gap:8px;margin:8px 0}.cols button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}.cols button.on{border-color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:4px 10px;border-radius:14px;background:var(--panel2);font-size:13px}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 2px}.mrow .nm{flex:1;min-width:0}.mrow small{color:var(--muted)}
.sm2{padding:6px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.thumbs img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:var(--panel2);cursor:pointer}
.mscroll{max-height:42vh;overflow:auto}
.botmenu{flex:none;height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line,rgba(255,255,255,.12));background:var(--panel2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;transition:.2s}.botmenu:hover{background:var(--grad);color:#fff;border-color:transparent}
.blk{margin:8px 12px 12px;padding:12px;border-radius:16px;background:var(--panel2);text-align:center;color:var(--muted)}

/* ---------- MinoChat: оформление ---------- */
.bub{font-size:var(--fs)}
[data-bub=sq] .bub{border-radius:8px}
[data-compact=on] .row{padding:5px 8px}[data-compact=on] .row .av{width:34px;height:34px;font-size:14px}
[data-anim=off] *{animation:none!important;transition:none!important}
[data-wall=aurora] .msgs{background:radial-gradient(600px 400px at 85% 8%,rgba(47,107,255,.16),transparent 60%),radial-gradient(520px 380px at 8% 92%,rgba(39,196,255,.12),transparent 60%)}
[data-wall=grid] .msgs{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px}
[data-wall=stars] .msgs{background-image:radial-gradient(1.5px 1.5px at 20px 30px,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 80px 70px,rgba(255,255,255,.3),transparent),radial-gradient(1.5px 1.5px at 140px 20px,rgba(120,180,255,.45),transparent);background-size:160px 100px}
[data-wall=sunset] .msgs{background:linear-gradient(160deg,rgba(255,120,60,.14),rgba(180,50,160,.14))}
[data-wall=forest] .msgs{background:linear-gradient(160deg,rgba(16,185,129,.14),rgba(5,60,40,.22))}
/* ---------- список чатов ---------- */
.chips{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;padding:5px 12px;border-radius:14px;background:var(--panel2);font-size:13px;color:var(--muted);transition:.2s}.chip2.on{background:var(--grad);color:#fff}
.offbar{margin:0 14px 8px;padding:8px 12px;border-radius:12px;background:rgba(255,92,122,.14);border:1px solid rgba(255,92,122,.4);color:#ff9bb0;font-size:13px}
.mdot{width:10px;height:10px;border-radius:50%;background:var(--a2);flex:none}
.atb{min-width:22px;height:22px;border-radius:11px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-right:4px}
/* ---------- текст сообщений ---------- */
.bq{display:block;margin:2px 0;padding:2px 0 2px 10px;border-left:3px solid rgba(255,255,255,.5);opacity:.92}
code.ic{background:rgba(0,0,0,.28);padding:1px 5px;border-radius:6px;font-family:Consolas,monospace;font-size:.92em}
pre.cb2{background:rgba(0,0,0,.32);padding:8px 10px;border-radius:10px;font-family:Consolas,monospace;font-size:.9em;overflow:auto;margin:4px 0;white-space:pre-wrap}
.spl{filter:blur(6px);cursor:pointer;transition:.25s;border-radius:4px;background:rgba(255,255,255,.12)}.spl.open{filter:none;background:none}
.mn{color:#9fd0ff;font-weight:600}.me .mn{color:#fff;text-decoration:underline}
.bub.bigemo{background:none!important;box-shadow:none!important;font-size:54px;line-height:1.1;padding:0 4px;animation:pop .4s both}
.bub.bigemo .meta{font-size:11px;color:var(--muted)}
.fcard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.22);margin-bottom:4px;color:inherit;text-decoration:none;min-width:200px}
.fcard .fi{font-size:26px}.fcard b{display:block;font-size:14px;word-break:break-all}.fcard small{opacity:.7}
.vc{display:flex;align-items:center;gap:6px}.vc button{padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.25);font-size:12px}
.sys{align-self:center;margin:6px 0;padding:4px 14px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:12.5px;text-align:center;max-width:90%}
.sys.call{cursor:pointer}.sys.call:hover{color:var(--text)}
.divn{align-self:stretch;display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--a2);font-size:12px}.divn:before,.divn:after{content:"";flex:1;height:1px;background:var(--a2);opacity:.5}
.m.selmode{cursor:pointer}.m.sel .bub{outline:2px solid var(--a2)}
.chk{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;background:var(--panel)}
.m.sel .chk{background:var(--a2);border-color:var(--a2);color:#fff}
.m.me .chk{left:auto;right:-26px}
.fab{position:absolute;right:18px;bottom:96px;width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:none;place-items:center;z-index:20;font-size:18px}
.fab.on{display:grid;animation:pop .2s both}.fab i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--grad);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px}
.selbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.selbar b{flex:1}
.tmr{font-size:11px;opacity:.7}
.dropz{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(5,8,20,.8);border:3px dashed var(--a2);font-size:20px;color:var(--text);pointer-events:none}.dropz.on{display:grid}
.cf{position:fixed;inset:0;z-index:95;pointer-events:none}
/* ---------- настройки ---------- */
.setm{display:grid;grid-template-columns:170px 1fr;gap:0;width:min(100%,780px);height:min(86vh,620px);padding:0!important;overflow:hidden}
.setm .nav{padding:14px 10px;border-right:1px solid var(--line);overflow:auto;background:var(--panel2)}
.setm .nav button{display:block;width:100%;padding:10px 12px;border-radius:12px;text-align:left;color:var(--muted);margin-bottom:2px}.setm .nav button.on{background:var(--grad);color:#fff}
.setm .body{padding:18px 22px;overflow:auto}.setm h2{margin:0 0 6px;font-size:19px}
.rl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.rl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rl select,.rl input[type=time],.rl input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 8px}
.rl input[type=range]{width:130px;accent-color:#2f6bff}.rl input[type=checkbox]{width:42px;height:24px;accent-color:#2f6bff}
.sw2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.sw2 button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}.sw2 button.on{border-color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv kbd{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-size:12px;justify-self:start}
.lockscr{position:fixed;inset:0;z-index:200;background:radial-gradient(900px 600px at 50% 0,#12307a,#050814);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.lockscr .dots{display:flex;gap:12px;margin:8px 0}.lockscr .dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.lockscr .dots i.f{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}.keys button{height:72px;border-radius:50%;background:rgba(255,255,255,.12);font-size:24px;color:#fff}
.keys button:active{background:rgba(255,255,255,.3)}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;margin-top:8px}
@media(max-width:800px){.setm{grid-template-columns:1fr;grid-template-rows:auto 1fr}.setm .nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.setm .nav button{flex:none;width:auto;margin:0 4px 0 0}.glist{grid-template-columns:1fr}.chk{display:none}}
@media(max-width:800px){

  .pane{display:none}.app.open .side{display:none}.app.open .pane{display:flex}
  .back{display:grid}.m{max-width:88%}.more{display:none}
  .ib{width:38px;height:38px;border-radius:13px}.head{gap:8px;padding:8px 10px}.comp .ib{width:38px;height:38px}
}

/* вход через Google: в браузере - окно, в Android - системное окно Google, в Windows-приложении - обычный браузер */
async function googleSignIn() {
  const cap = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() ? Capacitor.Plugins.FirebaseAuthentication : null;
  if (cap) {
    const r = await cap.signInWithGoogle({ skipNativeAuth: true });
    const idt = r && r.credential && r.credential.idToken;
    if (!idt) throw new Error('Google не вернул токен');
    return auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(idt));
  }
  if (/Electron\//.test(navigator.userAgent)) {
    const b = await fetch('/auth/begin', { method: 'POST' }).then((x) => x.json());
    if (!b.url) throw new Error(b.error || 'Вход через Google не настроен');
    window.open(b.url);
    toast('Откройте окно браузера и выберите аккаунт Google');
    const t0 = Date.now();
    while (Date.now() - t0 < 180000) {
      await new Promise((r) => setTimeout(r, 1000));
      const p = await fetch('/auth/poll?state=' + encodeURIComponent(b.state)).then((x) => x.json()).catch(() => ({}));
      if (p.token) return auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(p.token));
      if (p.error) throw new Error(p.error);
    }
    throw new Error('Время входа истекло');
  }
  return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

function loadImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); };
    img.src = u;
  });
}
async function shrinkImage(file) {
  const img = await loadImg(file);
  let max = 1280, q = 0.72;
  for (;;) {
    const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const d = cv.toDataURL('image/jpeg', q);
    if (d.length < 420000 || max < 400) return d;
    max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.06);
  }
}
async function shrinkSquare(file, size, limit, type) {
  const img = await loadImg(file);
  let s = size;
  for (;;) {
    const k = Math.min(1, s / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const d = cv.toDataURL(type, 0.8);
    if (d.length < limit || s < 48) return d;
    s = Math.round(s * 0.8);
  }
}

let rec = null;
const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function setRecUI(on) { const c = $('#comp'); if (c) c.classList.toggle('recing', on); const t = $('#recT'); if (t && on) t.textContent = '0:00'; }
async function startRec() {
  if (rec || !S.active) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Запись голоса не поддерживается в этом браузере');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast('Нет доступа к микрофону. Разрешите его для сайта (нужен HTTPS).'); }
  const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, mt ? { mimeType: mt, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
  const me = { mr, chunks: [], t0: Date.now(), send: false, timer: null, chat: S.active };
  rec = me;
  db.collection('chats').doc(me.chat).update({ ['typing.' + S.user.uid]: -Date.now() }).catch(() => {});
  mr.ondataavailable = (e) => { if (e.data && e.data.size) me.chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop()); clearInterval(me.timer); rec = null; setRecUI(false);
    db.collection('chats').doc(me.chat).update({ ['typing.' + S.user.uid]: 0 }).catch(() => {});
    if (!me.send) return;
    const dur = Math.round((Date.now() - me.t0) / 1000);
    if (dur < 1) return toast('Слишком короткое сообщение');
    const data = await blobToDataURL(new Blob(me.chunks, { type: mr.mimeType || 'audio/webm' }));
    if (data.length > 560000) return toast('Запись слишком длинная, сделайте покороче');
    sendMsg('', 'audio', { audio: data, dur }, me.chat);
  };
  mr.start(); setRecUI(true);
  me.timer = setInterval(() => { const s = Math.round((Date.now() - me.t0) / 1000), t = $('#recT'); if (t) t.textContent = mmss(s); if (s >= 90) stopRec(true); }, 250);
}

/* ---------- смена логина (раз в 15 дней) ---------- */
const UN_COOLDOWN = 15 * 86400000;
const unLeft = () => Math.max(0, ((S.me && S.me.usernameChangedAt) || 0) + UN_COOLDOWN - Date.now());
async function changeUsername(raw) {
  const nu = String(raw || '').trim().replace(/^@/, '');
  if (!/^[A-Za-z0-9_]{3,24}$/.test(nu)) throw new Error('Логин: 3–24 символа, только латиница, цифры и _');
  if (nu.toLowerCase() === S.me.usernameLower) throw new Error('Это ваш текущий логин');
  if (unLeft() > 0) throw new Error('Логин можно менять раз в 15 дней. Осталось дней: ' + Math.ceil(unLeft() / 86400000));
  const lower = nu.toLowerCase(), now = Date.now();
  const nref = db.collection('usernames').doc(lower), oref = db.collection('usernames').doc(S.me.usernameLower), pref = db.collection('users').doc(S.user.uid);
  await db.runTransaction(async (t) => {
    const s = await t.get(nref);
    if (s.exists) throw new Error('Этот логин уже занят');
    t.set(nref, { uid: S.user.uid }); t.update(pref, { username: nu, usernameLower: lower, usernameChangedAt: now }); t.delete(oref);
  });
  Object.assign(S.me, { username: nu, usernameLower: lower, usernameChangedAt: now });
  renderMe(); rememberAccount();
}

        (() => { const f = h('input', { type: 'file', accept: 'application/json', style: 'display:none', onchange: async (e) => { const file = e.target.files[0]; if (!file) return; try { const o = JSON.parse(await file.text()); Object.keys(o).forEach((k) => { if (k in DEF && k !== 'pin' && k !== 'pinSalt') cfg.set(k, o[k]); }); applyTheme(); toast('Настройки импортированы'); render(); renderList(); } catch { toast('Файл не подходит'); } } }); return h('div', {}, f, h('button', { class: 'btn ghost', onclick: () => f.click() }, '⬆ Импорт настроек')); })(),
